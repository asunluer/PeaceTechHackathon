name: Verify GUARDIA

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
        working-directory: guardia/apps/api
      - run: python -m pytest -q
        working-directory: guardia/apps/api

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: guardia/apps/web/package-lock.json
      - run: npm ci
        working-directory: guardia/apps/web
      - run: npm run check
        working-directory: guardia/apps/web
      - run: npm run build
        working-directory: guardia/apps/web

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
        working-directory: guardia/apps/mobile
      - run: flutter analyze
        working-directory: guardia/apps/mobile
      - run: flutter test
        working-directory: guardia/apps/mobile
      - run: flutter build apk --debug
        working-directory: guardia/apps/mobile

  ios-simulator:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
        working-directory: guardia/apps/mobile
      - run: flutter build ios --simulator --no-codesign
        working-directory: guardia/apps/mobile
