[project]
name = "safe-archive-api"
version = "0.1.0"
description = "Evidence preservation API for SAFE-ARCHIVE"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "pydantic-settings>=2.5,<3",
  "sqlalchemy[asyncio]>=2.0,<3",
  "alembic>=1.13,<2",
  "psycopg[binary]>=3.2,<4",
  "PyJWT>=2.10,<3",
  "pwdlib[argon2]>=0.3,<1",
  "python-multipart>=0.0.9,<1",
  "email-validator>=2.2,<3",
  "cryptography>=45,<47",
  "reportlab>=4.4,<5",
  "openai>=2,<3",
]

[tool.fastapi]
entrypoint = "app.main:app"
